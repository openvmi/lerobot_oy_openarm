[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_oy_openarm"
version = "0.1.0"
description = "LeRobot robot plugin for the dual-arm OY OpenArm follower"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "lerobot>=0.6.1,<0.7",
    "openarm-sdk>=26.10.8,<27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
